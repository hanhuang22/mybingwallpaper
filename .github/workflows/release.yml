name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset: x64
          - target: i686-pc-windows-msvc
            asset: x86
          - target: aarch64-pc-windows-msvc
            asset: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: Prepare clearly named release assets
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $msi -or -not $exe) {
            throw "Expected both MSI and NSIS installers for ${{ matrix.target }}"
          }
          Copy-Item $msi.FullName "release-assets/mybingwallpaper-${{ github.ref_name }}-windows-${{ matrix.asset }}.msi"
          Copy-Item $exe.FullName "release-assets/mybingwallpaper-${{ github.ref_name }}-windows-${{ matrix.asset }}-setup.exe"
          $signature = "$($exe.FullName).sig"
          if (-not (Test-Path $signature)) {
            throw "Expected updater signature for ${{ matrix.target }}"
          }
          Copy-Item $signature "release-assets/mybingwallpaper-${{ github.ref_name }}-windows-${{ matrix.asset }}-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          if-no-files-found: error
          path: release-assets/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: apple-silicon
          - target: x86_64-apple-darwin
            asset: intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: Prepare clearly named release asset
        run: |
          mkdir -p release-assets
          dmg_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -type f -name '*.dmg' -print | head -n 1)"
          updater_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -type f -name '*.app.tar.gz' -print | head -n 1)"
          test -n "$dmg_path" -a -n "$updater_path" -a -f "$updater_path.sig"
          cp "$dmg_path" "release-assets/mybingwallpaper-${{ github.ref_name }}-macos-${{ matrix.asset }}.dmg"
          cp "$updater_path" "release-assets/mybingwallpaper-${{ github.ref_name }}-macos-${{ matrix.asset }}.app.tar.gz"
          cp "$updater_path.sig" "release-assets/mybingwallpaper-${{ github.ref_name }}-macos-${{ matrix.asset }}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          if-no-files-found: error
          path: release-assets/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate signed updater manifest
        env:
          ASSET_DIR: release-assets
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/generate-github-updater-manifest.mjs
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
          body: |
            ## 安装包选择

            | 文件名 | 适用系统 |
            | --- | --- |
            | `mybingwallpaper-${{ github.ref_name }}-windows-x64-setup.exe` | Windows 10/11，Intel 或 AMD 64 位（推荐安装程序） |
            | `mybingwallpaper-${{ github.ref_name }}-windows-x64.msi` | Windows 10/11，Intel 或 AMD 64 位（MSI） |
            | `mybingwallpaper-${{ github.ref_name }}-windows-x86-setup.exe` | 32 位 Windows（安装程序） |
            | `mybingwallpaper-${{ github.ref_name }}-windows-x86.msi` | 32 位 Windows（MSI） |
            | `mybingwallpaper-${{ github.ref_name }}-windows-arm64-setup.exe` | Windows on ARM（安装程序） |
            | `mybingwallpaper-${{ github.ref_name }}-windows-arm64.msi` | Windows on ARM（MSI） |
            | `mybingwallpaper-${{ github.ref_name }}-macos-apple-silicon.dmg` | Apple Silicon Mac（M1、M2、M3、M4 等） |
            | `mybingwallpaper-${{ github.ref_name }}-macos-intel.dmg` | Intel Mac |

            当前安装包未进行商业代码签名。Windows 可能显示 SmartScreen 提示。macOS 安装包已进行完整的 ad-hoc 应用签名，但未经 Apple 公证；首次启动如出现开发者验证提示，请在 Finder 中右键应用并选择“打开”，或前往“系统设置 → 隐私与安全性”选择“仍要打开”。

  publish-gitee:
    needs: [windows, macos, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
      - name: Sync release tag to Gitee
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          git remote add gitee git@gitee.com:Hyman25/mybingwallpaper.git
          git push gitee "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish installers to Gitee Release
        env:
          ASSET_DIR: release-assets
          GITEE_API_TOKEN: ${{ secrets.GITEE_API_TOKEN }}
          GITEE_OWNER: Hyman25
          GITEE_REPO: mybingwallpaper
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/publish-gitee-release.mjs
      - name: Push updater manifest branch to Gitee
        run: |
          git fetch origin updater:refs/remotes/origin/updater
          git push --force gitee refs/remotes/origin/updater:refs/heads/updater
