name: Retry Gitee Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to synchronize
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
      - name: Prepare release tag and Gitee remote
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          echo "RELEASE_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          git remote add gitee git@gitee.com:Hyman25/mybingwallpaper.git
          git push gitee "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
      - name: Download existing GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'mybingwallpaper-*' --dir release-assets
          test "$(find release-assets -type f | wc -l)" -gt 0
      - name: Publish installers to Gitee Release
        env:
          ASSET_DIR: release-assets
          GITEE_API_TOKEN: ${{ secrets.GITEE_API_TOKEN }}
          GITEE_OWNER: Hyman25
          GITEE_REPO: mybingwallpaper
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node .github/scripts/publish-gitee-release.mjs
      - name: Push updater manifest branch to Gitee
        run: |
          git fetch origin updater:refs/remotes/origin/updater
          git push --force gitee refs/remotes/origin/updater:refs/heads/updater
