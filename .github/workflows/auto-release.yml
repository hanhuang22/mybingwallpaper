name: Auto release after desktop build

on:
  workflow_run:
    workflows: ["Desktop build"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false
  queue: max

jobs:
  tag-and-dispatch:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check tested commit and version
        id: candidate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/auto-release-candidate.mjs
      - name: Tag tested commit and start Release
        if: steps.candidate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          CREATE_TAG: ${{ steps.candidate.outputs.create_tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$CREATE_TAG" = "true" ]; then
            git tag "$TAG" "$TESTED_SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh workflow run release.yml --ref "$TAG"
